MEMORY {
    ZP: start=$0002, size=$00FE, type=rw, file="";
    STATE: start=$0200, size=$0600, type=rw, file="", define=yes;
    IMAGE: start=$0801, size=$77FF, type=rw, file=%O;
    WORKRAM: start=$C000, size=$1000, type=rw, file="", define=yes;
}
SEGMENTS {
    ZEROPAGE: load=ZP, type=zp;
    BSS: load=STATE, type=bss, define=yes;
    WORK: load=WORKRAM, type=bss, define=yes;
    BASIC: load=IMAGE, type=ro, start=$0801;
    CODE: load=IMAGE, type=rw, start=$080D, define=yes;
    RODATA: load=IMAGE, type=ro, define=yes;
}
