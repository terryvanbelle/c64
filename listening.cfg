# Stock C64. The score is above the VIC bank, all loaded below I/O.
MEMORY {
    ZP: start = $0002, size = $007E, type = rw, file = "";
    STATE: start = $0200, size = $0200, type = rw, file = "", define = yes;
    IMAGE: start = $0801, size = $C7FF, type = rw, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    BSS: load = STATE, type = bss, define = yes;
    BASIC: load = IMAGE, type = ro, start = $0801;
    CODE: load = IMAGE, type = rw, start = $080D;
    RODATA: load = IMAGE, type = ro, define = yes;
    SCORE: load = IMAGE, type = ro, start = $5000;
}
