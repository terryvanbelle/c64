MEMORY {
    ZP:  start = $0002, size = $00FE, type = rw, define = yes;
    PRG: start = $0801, size = $7FFF, file = %O, define = yes;
}

SEGMENTS {
    BASIC: load = PRG, type = ro, start = $0801, define = yes;
    CODE:  load = PRG, type = ro, start = $080D, define = yes;
    RODATA: load = PRG, type = ro, define = yes;
}
