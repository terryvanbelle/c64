# Stock C64: one loadable image ends below I/O; display storage is bank $4000.
MEMORY {
    ZP:    start = $0002, size = $001E, type = rw, file = "";
    STATE: start = $0200, size = $0200, type = rw, file = "", define = yes;
    IMAGE: start = $0801, size = $C7FF, type = rw, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    BSS: load = STATE, type = bss, define = yes;
    BASIC: load = IMAGE, type = ro, start = $0801;
    CODE: load = IMAGE, type = rw, start = $080D, define = yes;
    RODATA: load = IMAGE, type = ro, start = $2000, define = yes;
    BACKGROUND: load = IMAGE, type = ro, start = $3000, define = yes;
    FRAMES: load = IMAGE, type = ro, start = $6000, define = yes;
}
